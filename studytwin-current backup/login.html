<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyTwin — Sign In</title>
  <meta name="description" content="Sign in to StudyTwin to access your live cognitive load dashboard.">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root { --login-bg: #0A0F1E; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--login-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
      font-family: var(--ff, 'Inter', sans-serif);
    }

    /* ── Aurora background blobs ── */
    .aurora-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .aurora-blob-1 {
      width: 50vw; height: 50vw;
      background: rgba(37, 99, 235, 0.18);
      top: -15vh; left: -10vw;
      animation: drift1 18s ease-in-out infinite alternate;
    }
    .aurora-blob-2 {
      width: 40vw; height: 40vw;
      background: rgba(16, 185, 129, 0.12);
      bottom: -10vh; right: -5vw;
      animation: drift2 22s ease-in-out infinite alternate-reverse;
    }
    .aurora-blob-3 {
      width: 30vw; height: 30vw;
      background: rgba(139, 92, 246, 0.10);
      top: 30vh; right: 20vw;
      animation: drift1 26s ease-in-out infinite alternate;
    }
    @keyframes drift1 {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.1); }
    }
    @keyframes drift2 {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(-30px, -40px) scale(1.08); }
    }

    /* ── Card ── */
    .login-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      width: 100%;
      max-width: 440px;
      padding: 0 24px;
    }

    /* Wordmark */
    .login-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .login-logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(37,99,235,0.35);
    }
    .login-wordmark {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .login-wordmark em { font-style: normal; color: #60a5fa; }

    /* Card glass */
    .login-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 32px 64px -12px rgba(0,0,0,0.5),
                  inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .card-heading {
      text-align: center;
      margin-bottom: 36px;
    }
    .card-heading h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .card-heading p {
      font-size: 14px;
      color: rgba(255,255,255,0.45);
      line-height: 1.6;
    }

    /* Google Sign-In button */
    #google-signin-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 24px;
      background: #2563EB;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: var(--ff, 'Inter', sans-serif);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(37,99,235,0.35);
      position: relative;
      overflow: hidden;
    }
    #google-signin-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    #google-signin-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37,99,235,0.45); }
    #google-signin-btn:hover::before { opacity: 1; }
    #google-signin-btn:active { transform: translateY(0); }
    #google-signin-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Google logo SVG */
    .google-icon {
      width: 20px; height: 20px; flex-shrink: 0;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }
    .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
    .divider-text { font-size: 12px; color: rgba(255,255,255,0.25); }

    /* Status / error */
    #auth-status {
      margin-top: 20px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
      line-height: 1.5;
      display: none;
    }
    #auth-status.loading { color: rgba(255,255,255,0.5); display: block; }
    #auth-status.error { color: #f87171; display: block; }
    #auth-status.success { color: #34d399; display: block; }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }


    /* Badges */
    .login-badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
    .login-badge {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 100px;
      padding: 5px 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body data-page="login">

  <!-- Aurora Blobs -->
  <div class="aurora-blob aurora-blob-1"></div>
  <div class="aurora-blob aurora-blob-2"></div>
  <div class="aurora-blob aurora-blob-3"></div>

  <div class="login-wrap">

    <!-- Logo -->
    <a class="login-logo" href="login.html">
      <div class="login-logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="2" x2="12" y2="6"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="6" y2="12"/>
          <line x1="18" y1="12" x2="22" y2="12"/>
        </svg>
      </div>
      <div class="login-wordmark">Study<em>Twin</em></div>
    </a>

    <!-- Card -->
    <div class="login-card">
      <div class="card-heading">
        <h1>Welcome back</h1>
        <p>Sign in to access your live cognitive<br>load dashboard and session history</p>
      </div>

      <button id="google-signin-btn" onclick="handleGoogleSignIn()">
        <!-- Google Icon -->
        <svg class="google-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div id="auth-status"></div>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">Secure Google OAuth 2.0</div>
        <div class="divider-line"></div>
      </div>

      <div class="login-badges">
        <div class="login-badge">Enterprise Authentication</div>
        <div class="login-badge">Encrypted Telemetry</div>
        <div class="login-badge">Cognitive Analytics</div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script>
    // ── Firebase Init ──────────────────────────────────────────
    var FIREBASE_CONFIG = {
      apiKey: "AIzaSyBXZZ-wN2wzguf35rfPaLqm61gx0LoxIAA",
      authDomain: "studytwin-rvce.firebaseapp.com",
      databaseURL: "https://studytwin-rvce-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "studytwin-rvce",
      storageBucket: "studytwin-rvce.firebasestorage.app",
      messagingSenderId: "345837599600",
      appId: "1:345837599600:web:f2c191ab3cf7c24ca5edb5"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }

    const auth = firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    // ── If already logged in, go straight to dashboard ────────
    auth.onAuthStateChanged(user => {
      if (user) {
        showStatus('success', '✓ Signed in — redirecting to dashboard...');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      }
    });

    // ── Google Sign-In ─────────────────────────────────────────
    function handleGoogleSignIn() {
      const btn = document.getElementById('google-signin-btn');
      const status = document.getElementById('auth-status');

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> Signing in...`;

      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      provider.addScope('profile');
      provider.addScope('email');

      auth.signInWithPopup(provider)
        .then(result => {
          showStatus('success', '✓ Signed in as ' + result.user.displayName + ' — redirecting...');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
        })
        .catch(err => {
          console.error('[Login] Sign-in error:', err);
          let msg = 'Sign-in failed. Please try again.';
          if (err.code === 'auth/popup-closed-by-user') msg = 'Sign-in popup was closed. Please try again.';
          if (err.code === 'auth/network-request-failed') msg = 'Network error. Check your connection.';
          showStatus('error', '✗ ' + msg);
          btn.disabled = false;
          btn.innerHTML = `<svg class="google-icon" viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>Continue with Google`;
        });
    }

    function showStatus(type, msg) {
      const el = document.getElementById('auth-status');
      el.className = type;
      el.textContent = msg;
    }
  </script>
</body>
</html>
